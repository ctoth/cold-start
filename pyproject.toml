[project]
name = "cold-start"
version = "0.1.0"
description = "Number theory from scratch: a De Bruijn-style proof checker in Python."
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
