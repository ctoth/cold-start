[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-start"
version = "0.1.0"
description = "Number theory from scratch: a De Bruijn-style proof checker in Python."
requires-python = ">=3.11"
dependencies = ["hamblin"]

[project.scripts]
cold-start-verify = "cold_start.verify:cli"
cold-start-ledger = "cold_start.ledger:main"
cold-start-lean = "cold_start.lean.__main__:main"

[tool.uv]
package = true

[tool.uv.sources]
hamblin = { git = "https://github.com/ctoth/hamblin" }

[tool.setuptools.packages.find]
include = ["cold_start", "cold_start.*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "hypothesis>=6.155.2",
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]
